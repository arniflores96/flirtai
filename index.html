<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flirtai.es — Strategic Dating Core</title>
<style>
  :root { --bg: #0A0A0A; --panel: #121212; --border: #262626; --white: #FFF; --gray: #8E8E93; --red: #FF3B30; }
  body { background: var(--bg); color: var(--white); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; }
  
  /* Layout */
  aside { width: 300px; border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
  main { flex-grow: 1; overflow-y: auto; padding: 40px; display: flex; justify-content: center; }
  .container { max-width: 600px; width: 100%; }
  
  /* UI Elements */
  .card { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
  select, textarea, input { width: 100%; background: #181818; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; margin-top: 8px; font-family: inherit; }
  button { width: 100%; padding: 14px; background: var(--white); color: black; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  button:disabled { opacity: 0.5; }
  
  .msg-card { background: #1A1A1A; border: 1px solid var(--border); padding: 15px; margin-bottom: 10px; border-radius: 8px; }
  .tag { font-size: 10px; text-transform: uppercase; color: var(--gray); letter-spacing: 1px; }
  .hidden { display: none; }
</style>
</head>
<body>

<aside>
  <h2>Flirtai.es</h2>
  <p style="color:var(--gray); font-size:12px;">Panel de Control Táctico</p>
  <div id="history" style="margin-top:20px;"></div>
</aside>

<main>
  <div class="container">
    <div class="card">
      <label>Estrategia de Conversación</label>
      <select id="goal-mode">
        <option value="icebreaker">Romper el hielo (Inicio)</option>
        <option value="alive">Mantener la conversación</option>
        <option value="close">Cerrar cita (Cita en persona)</option>
      </select>

      <label style="display:block; margin-top:15px;">Contexto / Mensaje Recibido</label>
      <textarea id="their-msg" rows="3" placeholder="Pega lo que te han dicho..."></textarea>
      
      <input type="file" id="img-input" accept="image/*" class="hidden" onchange="previewImg(this)">
      <button onclick="document.getElementById('img-input').click()" style="background:none; border:1px solid var(--border); color:white;">+ Subir captura de pantalla</button>
      
      <button id="gen-btn" onclick="processAI()">Generar 3 Respuestas</button>
    </div>

    <!-- Resultados e Iteración -->
    <div id="results-area" class="hidden">
      <div id="results-list"></div>
      <div class="card" style="margin-top:20px;">
        <label>¿Quieres ajustar algo?</label>
        <textarea id="refinement-input" placeholder="Ej: 'Hazla más divertida', 'No uses emojis', 'Sé más directo'..."></textarea>
        <button onclick="processAI(true)" style="background: #333; color: white;">Refinar estas respuestas</button>
      </div>
    </div>
  </div>
</main>

<script>
  let imgBase64 = null;

  function previewImg(input) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = e => { imgBase64 = e.target.result.split(',')[1]; alert('Imagen cargada'); };
    reader.readAsDataURL(file);
  }

  async function processAI(isRefinement = false) {
    const btn = document.getElementById('gen-btn');
    btn.disabled = true;
    btn.innerText = "Pensando...";

    const payload = {
      goal: document.getElementById('goal-mode').value,
      msg: document.getElementById('their-msg').value,
      refinement: isRefinement ? document.getElementById('refinement-input').value : null,
      image: imgBase64
    };

    try {
      // Simulación de llamada a tu función de Netlify
      const response = await fetch('/.netlify/functions/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await response.json();
      renderResults(data.mensajes);
    } catch (e) {
      // Mock para prueba
      renderResults([
        { etiqueta: "Opción A", texto: "¡Hola! He visto que te gusta [tema], ¿has estado en...?" },
        { etiqueta: "Opción B", texto: "Curioso tu comentario sobre..., ¿qué opinas de...?" },
        { etiqueta: "Opción C", texto: "Propuesta de cita directa: ¿Te apetece un café el jueves?" }
      ]);
    }
    btn.disabled = false;
    btn.innerText = "Generar 3 Respuestas";
  }

  function renderResults(mensajes) {
    document.getElementById('results-area').classList.remove('hidden');
    const list = document.getElementById('results-list');
    list.innerHTML = "";
    mensajes.forEach(m => {
      list.innerHTML += `
        <div class="msg-card">
          <div class="tag">${m.etiqueta}</div>
          <p>${m.texto}</p>
          <button onclick="navigator.clipboard.writeText('${m.texto}')" style="font-size:10px; padding:5px;">Copiar</button>
        </div>`;
    });
  }
</script>
</body>
</html>
