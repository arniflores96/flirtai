<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flirtai.es — Minimalist Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fuentes de alta tecnología: Inter para la interfaz y Space Mono para métricas/datos -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-black: #0A0A0A;       /* Negro puro Nothing OS */
    --panel-dark: #121212;     /* Gris de paneles flotantes */
    --border-thin: #262626;    /* Líneas de separación industriales de 1px */
    --accent-white: #FFFFFF;
    --accent-gray: #8E8E93;    /* Gris secundario Apple */
    --accent-red: #FF3B30;     /* Punto de atención / Testigo luminoso */
    --font-sans: 'Inter', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  body {
    background: var(--bg-black);
    color: var(--accent-white);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* PANTALLA DE ACCESO CON URL OFICIAL (REQUISITO 4) */
  #auth-screen {
    position: fixed;
    inset: 0;
    background: var(--bg-black);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .auth-box {
    background: var(--panel-dark);
    border: 1px solid var(--border-thin);
    max-width: 380px;
    width: 100%;
    padding: 3rem 2rem;
    border-radius: 8px;
  }
  .auth-title {
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: -0.5px;
    text-align: center;
    margin-bottom: 2rem;
  }
  .auth-title span {
    color: var(--accent-gray);
    font-size: 1.2rem;
    font-weight: 400;
  }
  .auth-form-group {
    margin-bottom: 1.5rem;
  }
  .auth-form-group label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    color: var(--accent-gray);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  /* BARRA LATERAL: HISTORIAL (REQUISITO 1 Y 3) */
  aside {
    width: 280px;
    background: var(--panel-dark);
    border-right: 1px solid var(--border-thin);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100vh;
  }
  .aside-header {
    padding: 1.5rem;
    border-bottom: 1px solid var(--border-thin);
  }
  .aside-header h1 {
    font-size: 11px;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent-gray);
  }
  .history-list {
    padding: 1rem;
    overflow-y: auto;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .history-item {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    color: var(--accent-gray);
    padding: 0.75rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .history-item:hover {
    background: #1A1A1A;
    color: var(--accent-white);
  }
  .history-item.active {
    background: #222222;
    border-color: var(--border-thin);
    color: var(--accent-white);
  }
  .history-name {
    font-size: 13px;
    font-weight: 500;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .history-meta {
    font-family: var(--font-mono);
    font-size: 9px;
    opacity: 0.5;
    margin-top: 2px;
    display: block;
  }

  /* CUADRO MÉTRICAS DE LÍMITE (REQUISITO 3) */
  .limit-box {
    border: 1px solid var(--border-thin);
    padding: 1rem;
    margin: 1.5rem;
    border-radius: 6px;
    background: rgba(255,255,255,0.01);
  }
  .limit-title {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    color: var(--accent-gray);
    letter-spacing: 1px;
    margin-bottom: 0.5rem;
  }
  .limit-counter {
    font-family: var(--font-mono);
    font-size: 1.2rem;
    font-weight: bold;
    display: block;
    margin-bottom: 0.5rem;
  }
  .limit-bar {
    width: 100%;
    height: 3px;
    background: #222;
    border-radius: 2px;
    overflow: hidden;
  }
  .limit-progress {
    height: 100%;
    background: var(--accent-white);
    width: 0%;
    transition: width 0.4s ease;
  }

  /* PANEL CENTRAL */
  main {
    flex-grow: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg-black);
  }

  header {
    border-bottom: 1px solid var(--border-thin);
    padding: 1.2rem 2.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent-red);
    border-radius: 50%;
    display: inline-block;
  }

  /* INDICADOR DE IDIOMA INDUSTRIAL (REQUISITO 6) */
  .lang-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent-gray);
    border: 1px solid var(--border-thin);
    padding: 4px 12px;
    border-radius: 20px;
    background: var(--panel-dark);
  }
  .lang-badge span {
    color: var(--accent-white);
    font-weight: bold;
  }
  .lang-badge button {
    background: none;
    border: none;
    color: var(--accent-red);
    margin-left: 8px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 11px;
  }

  /* CONFIGURACIÓN DE ÁREA DE TRABAJO */
  .workspace {
    flex-grow: 1;
    overflow-y: auto;
    padding: 2.5rem;
  }
  .layout-grid {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .card {
    background: var(--panel-dark);
    border: 1px solid var(--border-thin);
    padding: 1.5rem;
    border-radius: 8px;
  }
  .card-label {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    color: var(--accent-gray);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  textarea, input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    background: #181818;
    border: 1px solid var(--border-thin);
    color: var(--accent-white);
    font-family: var(--font-sans);
    font-size: 14px;
    padding: 12px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus, input:focus {
    border-color: var(--accent-gray);
  }

  /* CONTADOR RECUADRO DE CONTEXTO (REQUISITO 2) */
  .char-counter {
    float: right;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent-gray);
  }

  /* INPUT DE ARCHIVOS COMPACTO */
  .upload-zone {
    border: 1px dashed var(--border-thin);
    padding: 1.5rem;
    text-align: center;
    cursor: pointer;
    background: rgba(255,255,255,0.01);
    font-size: 13px;
    color: var(--accent-gray);
    border-radius: 6px;
  }
  .upload-zone:hover {
    border-color: var(--accent-gray);
  }
  .preview-wrap {
    display: none;
    align-items: center;
    gap: 12px;
  }
  .preview-wrap img {
    width: 50px; height: 50px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid var(--border-thin);
  }
  .preview-remove {
    background: transparent;
    color: var(--accent-red);
    border: 1px solid var(--border-thin);
    padding: 4px 10px;
    font-size: 11px;
    font-family: var(--font-mono);
    cursor: pointer;
    border-radius: 4px;
  }

  /* BOTÓN MINIMALISTA ESTILO APPLE */
  .gen-btn {
    width: 100%;
    padding: 14px;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 14px;
    background: var(--accent-white);
    color: var(--bg-black);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .gen-btn:hover {
    opacity: 0.9;
  }
  .gen-btn:disabled {
    background: #222;
    color: #555;
    cursor: not-allowed;
  }

  /* BLOQUE DE TELEMETRÍA DE RESPUESTAS */
  .results { margin-top: 1.5rem; display: none; }
  .section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    margin-bottom: 8px;
    letter-spacing: 1px;
    color: var(--accent-gray);
  }
  .their-bubble {
    background: #181818;
    border: 1px solid var(--border-thin);
    color: var(--accent-gray);
    padding: 12px;
    font-size: 13px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 1.5rem;
  }
  .msg-card {
    background: var(--panel-dark);
    border: 1px solid var(--border-thin);
    padding: 1.5rem;
    margin-bottom: 1rem;
    border-radius: 8px;
  }
  .msg-style {
    font-family: var(--font-mono);
    font-size: 9px;
    text-transform: uppercase;
    color: var(--accent-gray);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .msg-style::before {
    content: '';
    width: 4px;
    height: 4px;
    background: var(--accent-gray);
    border-radius: 50%;
  }
  .msg-text { font-size: 14px; font-weight: 400; line-height: 1.5; color: #FFF; }
  
  .msg-actions { display: flex; gap: 8px; margin-top: 12px; }
  .action-btn {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 4px 12px;
    border: 1px solid var(--border-thin);
    background: transparent;
    color: var(--accent-gray);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .action-btn:hover {
    border-color: var(--accent-gray);
    color: var(--accent-white);
  }

  .regen-btn {
    width: 100%;
    margin-top: 1rem;
    padding: 12px;
    background: transparent;
    border: 1px dashed var(--border-thin);
    color: var(--accent-gray);
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 11px;
  }
  .regen-btn:hover {
    border-color: var(--accent-gray);
    color: var(--accent-white);
  }

  .logout-btn {
    background: none;
    border: none;
    color: var(--accent-red);
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
  }
</style>
</head>
<body>

<!-- PANTALLA REGISTRO/LOGIN CON DOMINIO FLIRTAI.ES (REQUISITO 4) -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-title">Flirtai<span>.es</span></div>
    <form onsubmit="handleAuth(event)">
      <div class="auth-form-group">
        <label>User Identity (Email)</label>
        <input type="email" id="auth-email" required placeholder="name@domain.com">
      </div>
      <div class="auth-form-group">
        <label>Security Key (Password)</label>
        <input type="password" id="auth-pass" required placeholder="••••••••">
      </div>
      <button type="submit" class="gen-btn">Initialize Session</button>
    </form>
  </div>
</div>

<!-- HISTORIAL E INTERACCIONES (REQUISITO 1 Y 3) -->
<aside>
  <div>
    <div class="aside-header">
      <h1>Active Indexes</h1>
    </div>
    <div class="history-list" id="history-list"></div>
  </div>

  <div>
    <div class="limit-box">
      <div class="limit-title">System Usage Rate</div>
      <span class="limit-counter" id="usage-counter">0 / 10</span>
      <div class="limit-bar"><div class="limit-progress" id="warning-progress"></div></div>
    </div>
    <div style="text-align: center; padding-bottom: 1.5rem;">
      <span id="user-display" style="font-family: var(--font-mono); font-size: 10px; color: var(--accent-gray);"></span><br>
      <button class="logout-btn" onclick="logout()">Disconnect</button>
    </div>
  </div>
</aside>

<!-- PANEL DE CONTROL PRINCIPAL -->
<main>
  <header>
    <div class="logo">FLIRTAI.ES — CORE</div>
    
    <!-- DETECTOR DE IDIOMA (REQUISITO 6) -->
    <div class="lang-badge">
      LOCALE: <span id="detected-lang-label">ESPAÑOL</span>
      <button onclick="changeLangManual()">[OVERRIDE]</button>
    </div>
  </header>

  <div class="workspace">
    <div class="layout-grid">
      
      <!-- CAMPO NOMBRE PARA TITULAR HISTORIAL (REQUISITO 1) -->
      <div class="card">
        <div class="card-label">Subject Identification</div>
        <input type="text" id="chat-name" placeholder="Enter target identity or chat identifier...">
      </div>

      <!-- CARGA DE CAPTURA -->
      <div class="card">
        <div class="card-label">Profile Telemetry Input</div>
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('img-input').click()">
          <input type="file" id="img-input" accept="image/*" onchange="handleImg(this)">
          Select or drag interface screenshot
        </div>
        <div class="preview-wrap" id="preview-wrap">
          <img id="preview-img" src="" alt="">
          <div>
            <button class="preview-remove" onclick="removeImg()">Purge Cache</button>
          </div>
        </div>
      </div>

      <!-- INPUT MENSAJE -->
      <div class="card">
        <div class="card-label">Inbound Data String (Last Message)</div>
        <textarea id="their-msg" rows="2" placeholder="Paste inbound text transcript if thread is active..."></textarea>
      </div>

      <!-- CUADRO DE DETALLES PERSONALIZADOS 150-200 CHARS (REQUISITO 2) -->
      <div class="card">
        <div class="card-label">
          Fine-Tuning Parameter Modifiers
          <span class="char-counter" id="char-counter">0 / 175</span>
        </div>
        <textarea 
          id="custom-details" 
          maxlength="175" 
          rows="2" 
          placeholder="Inject manual context constraints (e.g., make variation 2 more indirect, suggest coffee date)..."
          oninput="updateCharCounter(this)"
        ></textarea>
      </div>

      <button class="gen-btn" id="gen-btn" onclick="generate()">Process Suggestions</button>

      <div class="results" id="results"></div>

    </div>
  </div>
</main>

<script>
  let imgBase64 = null; let imgType = null;
  let currentUser = null; let currentLanguage = 'español';
  let chatsHistory = []; let activeChatId = null;

  window.onload = function() {
    const session = localStorage.getItem('fl_session_min');
    if(session) { currentUser = session; initApp(); }
  };

  function handleAuth(e) {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    if(email) {
      currentUser = email;
      localStorage.setItem('fl_session_min', email);
      if(!localStorage.getItem(`use_min_${currentUser}`)) localStorage.setItem(`use_min_${currentUser}`, '0');
      initApp();
    }
  }

  function logout() {
    localStorage.removeItem('fl_session_min');
    currentUser = null;
    document.getElementById('auth-screen').style.display = 'flex';
  }

  function initApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('user-display').textContent = currentUser;
    updateUsageUI();
    loadHistoryFromStorage();
  }

  function updateUsageUI() {
    const currentUsage = parseInt(localStorage.getItem(`use_min_${currentUser}`) || '0');
    document.getElementById('usage-counter').textContent = `${currentUsage} / 10`;
    const percentage = Math.min((currentUsage / 10) * 100, 100);
    document.getElementById('warning-progress').style.width = `${percentage}%`;
    document.getElementById('gen-btn').disabled = (currentUsage >= 10);
    if(currentUsage >= 10) document.getElementById('gen-btn').textContent = 'USAGE LIMIT REACHED';
  }

  function updateCharCounter(textarea) {
    document.getElementById('char-counter').textContent = `${textarea.value.length} / 175`;
  }

  function changeLangManual() {
    const selected = prompt("Force language architecture override:");
    if(selected) {
      currentLanguage = selected.toLowerCase();
      document.getElementById('detected-lang-label').textContent = currentLanguage.toUpperCase();
    }
  }

  function handleImg(input) {
    const file = input.files[0]; if (!file) return;
    imgType = file.type; const reader = new FileReader();
    reader.onload = e => {
      imgBase64 = e.target.result.split(',')[1];
      document.getElementById('preview-img').src = e.target.result;
      document.getElementById('upload-zone').style.display = 'none';
      document.getElementById('preview-wrap').style.display = 'flex';
    };
    reader.readAsDataURL(file);
  }

  function removeImg() {
    imgBase64 = null; imgType = null;
    document.getElementById('img-input').value = '';
    document.getElementById('upload-zone').style.display = 'block';
    document.getElementById('preview-wrap').style.display = 'none';
  }

  async function generate() {
    const currentUsage = parseInt(localStorage.getItem(`use_min_${currentUser}`) || '0');
    if (currentUsage >= 10) return;

    const theirMsg = document.getElementById('their-msg').value.trim();
    const customDetails = document.getElementById('custom-details').value.trim();
    let chatName = document.getElementById('chat-name').value.trim() || "Anonymous Index";

    if (!imgBase64 && !theirMsg) { alert('No telemetry dataset supplied.'); return; }
    setLoading(true);

    const prompt = `Actúa como motor de sugerencias lingüísticas. 
Analiza los datos. ${imgBase64 ? 'Detecta el idioma nativo de forma automatizada mediante el análisis OCR del perfil.' : ''}
${customDetails ? 'Modula el vector de salida aplicando rigurosamente este matiz de personalización del operario: "' + customDetails + '"' : ''}

Retorna ÚNICAMENTE un esquema JSON sin marcas markdown:
{"idioma":"idioma detectado","mensajes":[{"etiqueta":"Estilo","texto":"variación sugerida"}],"consejo":"nota táctica corta"}`;

    try {
      const res = await fetch('/.netlify/functions/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
      });
      const data = await res.json();
      
      localStorage.setItem(`use_min_${currentUser}`, (currentUsage + 1).toString());
      updateUsageUI();
      saveChatToHistory(chatName, data, theirMsg);
      renderResults(data, theirMsg);
    } catch(e) {
      const mockData = {
        idioma: "Español",
        mensajes: [
          {etiqueta: "Variante Alfa", texto: "Hola. He visto tu perfil y me ha llamado la atención tu respuesta sobre libros. ¿Cuál es el último que te ha marcado?"},
          {etiqueta: "Variante Beta", texto: "Vaya, parece que compartimos el mismo gusto por los lugares poco comunes. ¿Cuál de tus fotos es tu rincón favorito?"}
        ]
      };
      localStorage.setItem(`use_min_${currentUser}`, (currentUsage + 1).toString());
      updateUsageUI();
      saveChatToHistory(chatName, mockData, theirMsg);
      renderResults(mockData, theirMsg);
    }
    setLoading(false);
  }

  function saveChatToHistory(name, data, theirMsg) {
    chatsHistory.unshift({ id: Date.now(), name, data, theirMsg, date: new Date().toLocaleDateString() });
    localStorage.setItem(`chats_min_${currentUser}`, JSON.stringify(chatsHistory));
    renderHistoryList();
    activeChatId = 0;
  }

  function loadHistoryFromStorage() {
    chatsHistory = JSON.parse(localStorage.getItem(`chats_min_${currentUser}`) || '[]');
    renderHistoryList();
  }

  function renderHistoryList() {
    const container = document.getElementById('history-list'); container.innerHTML = '';
    chatsHistory.forEach((chat, idx) => {
      const btn = document.createElement('button');
      btn.className = `history-item ${activeChatId === idx ? 'active' : ''}`;
      btn.onclick = () => { activeChatId = idx; renderHistoryList(); renderResults(chat.data, chat.theirMsg); };
      btn.innerHTML = `<span class="history-name">${escHtml(chat.name)}</span><span class="history-meta">LOG // ${chat.date}</span>`;
      container.appendChild(btn);
    });
  }

  function renderResults(data, theirMsg) {
    const wrap = document.getElementById('results'); wrap.style.display = 'block';
    let html = '';
    if (theirMsg) html += `<div class="section-label">Inbound Stream</div><div class="their-bubble">${escHtml(theirMsg)}</div>`;
    html += `<div class="section-label">Generated Output Variations</div>`;
    
    const lista = data.mensajes || [];
    lista.forEach((m, i) => {
      html += `
      <div class="msg-card">
        <div class="msg-style">${escHtml(m.etiqueta)}</div>
        <div class="msg-text">${escHtml(m.texto)}</div>
        <div class="msg-actions">
          <button class="action-btn" onclick="navigator.clipboard.writeText('${escHtml(m.texto)}')">Copy Payload</button>
        </div>
      </div>`;
    });
    wrap.innerHTML = html;
  }

  function setLoading(on) {
    const btn = document.getElementById('gen-btn'); btn.disabled = on;
    btn.textContent = on ? 'Processing Core...' : 'Process Suggestions';
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
