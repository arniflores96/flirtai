<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlirtAI — Edition 90/00</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Tipografía suiza muy limpia y estructurada propia de los anuncios de tabaco -->
<link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-cream: #F4F0EA;       /* Fondo crema suave de catálogo clásico */
    --marlboro-red: #C8102E;   /* Rojo corporativo mate */
    --camel-yellow: #E5A93C;   /* Amarillo desierto / tabaco Camel */
    --camel-blue: #0A2240;     /* Azul oscuro profundo */
    --text-black: #1A1A1A;     /* Negro tipográfico */
    --border-thick: 3px solid #1A1A1A;
  }

  body {
    background: var(--bg-cream);
    color: var(--text-black);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* PANTALLA DE AUTENTICACIÓN (REQUISITO 4) */
  #auth-screen {
    position: fixed;
    inset: 0;
    background: var(--camel-blue);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .auth-box {
    background: var(--bg-cream);
    border: var(--border-thick);
    max-width: 400px;
    width: 100%;
    padding: 2.5rem;
    box-shadow: 10px 10px 0px var(--marlboro-red);
  }
  .auth-title {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 900;
    font-size: 2rem;
    letter-spacing: -1px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 1.5rem;
    color: var(--text-black);
  }
  .auth-form-group {
    margin-bottom: 1.2rem;
  }
  .auth-form-group label {
    display: block;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  /* BARRA LATERAL: HISTORIAL (REQUISITO 1 Y 3) */
  aside {
    width: 300px;
    background: #EFEBE4;
    border-right: var(--border-thick);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100vh;
  }
  .aside-header {
    background: var(--marlboro-red);
    color: white;
    padding: 1.5rem 1rem;
    border-bottom: var(--border-thick);
    text-align: center;
  }
  .aside-header h1 {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 900;
    font-size: 1.4rem;
    text-transform: uppercase;
    letter-spacing: 0px;
  }
  .history-list {
    padding: 1rem;
    overflow-y: auto;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .history-item {
    width: 100%;
    text-align: left;
    background: white;
    border: 2px solid var(--text-black);
    padding: 0.8rem 1rem;
    cursor: pointer;
    transition: all 0.1s;
  }
  .history-item:hover, .history-item.active {
    background: var(--camel-yellow);
    color: var(--camel-blue);
    font-weight: bold;
  }
  .history-name {
    font-size: 13px;
    text-transform: uppercase;
    display: block;
  }
  .history-meta {
    font-size: 10px;
    opacity: 0.6;
  }

  /* RECUADRO DE LÍMITE (REQUISITO 3) */
  .limit-box {
    background: white;
    border: var(--border-thick);
    padding: 1rem;
    margin: 1rem;
    box-shadow: 4px 4px 0px var(--camel-blue);
  }
  .limit-title {
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    color: var(--marlboro-red);
    letter-spacing: 1px;
    text-align: center;
    margin-bottom: 0.5rem;
  }
  .limit-counter {
    font-size: 1.5rem;
    font-weight: bold;
    text-align: center;
    display: block;
    margin-bottom: 0.5rem;
  }
  .limit-bar {
    width: 100%;
    height: 8px;
    background: #DDD;
  }
  .limit-progress {
    height: 100%;
    background: var(--marlboro-red);
    width: 0%;
    transition: width 0.3s;
  }

  /* CONTENEDOR PRINCIPAL DE LA APP */
  main {
    flex-grow: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg-cream);
  }

  header {
    background: white;
    border-bottom: var(--border-thick);
    padding: 1.2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 900;
    font-size: 1.8rem;
    text-transform: uppercase;
    letter-spacing: -1px;
    color: var(--text-black);
  }
  .logo span {
    color: var(--marlboro-red);
  }

  /* INDICADOR DE IDIOMA AUTOMÁTICO (REQUISITO 6) */
  .lang-badge {
    border: 2px solid var(--text-black);
    background: var(--camel-yellow);
    padding: 4px 10px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
  }
  .lang-badge button {
    background: none;
    border: none;
    text-decoration: underline;
    margin-left: 6px;
    cursor: pointer;
    font-weight: bold;
  }

  /* ZONA DE FORMULARIOS */
  .workspace {
    flex-grow: 1;
    overflow-y: auto;
    padding: 2rem;
  }
  .layout-grid {
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  .card {
    background: white;
    border: 2px solid var(--text-black);
    padding: 1.2rem;
  }
  .card-label {
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    color: var(--camel-blue);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  textarea, input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    background: #FAF8F5;
    border: 2px solid var(--text-black);
    color: var(--text-black);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    padding: 10px;
    outline: none;
  }
  textarea:focus, input:focus {
    background: white;
    border-color: var(--marlboro-red);
  }

  /* CUADRO DE 150-200 CARACTERES (REQUISITO 2) */
  .char-counter {
    float: right;
    font-size: 11px;
    font-weight: bold;
    color: var(--marlboro-red);
  }

  /* SUBIDA DE CAPTURAS */
  .upload-zone {
    border: 2px dashed var(--marlboro-red);
    padding: 1.2rem;
    text-align: center;
    cursor: pointer;
    background: rgba(200, 16, 46, 0.02);
    font-size: 13px;
    font-weight: bold;
  }
  .preview-wrap {
    display: none;
    align-items: center;
    gap: 12px;
  }
  .preview-wrap img {
    width: 60px; height: 60px;
    object-fit: cover;
    border: 2px solid var(--text-black);
  }
  .preview-remove {
    background: var(--marlboro-red);
    color: white;
    border: none;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
    text-transform: uppercase;
  }

  /* BOTÓN CORPORATIVO MACIZO */
  .gen-btn {
    width: 100%;
    padding: 15px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 900;
    font-size: 15px;
    text-transform: uppercase;
    background: var(--text-black);
    color: white;
    border: none;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.2s;
  }
  .gen-btn:hover {
    background: var(--marlboro-red);
  }
  .gen-btn:disabled {
    background: #CCC;
    color: #666;
    cursor: not-allowed;
  }

  /* BLOQUES DE RESPUESTAS */
  .results { margin-top: 1.5rem; display: none; }
  .section-label {
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 6px;
    letter-spacing: 1px;
    color: var(--text-black);
  }
  .their-bubble {
    background: var(--camel-blue);
    color: white;
    padding: 10px;
    font-size: 13px;
    display: inline-block;
    margin-bottom: 1rem;
  }
  .msg-card {
    background: white;
    border: 2px solid var(--text-black);
    padding: 1.2rem;
    margin-bottom: 1rem;
    position: relative;
  }
  .msg-style {
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    color: var(--marlboro-red);
    margin-bottom: 6px;
  }
  .msg-text { font-size: 15px; font-weight: 500; line-height: 1.4; }
  
  .msg-actions { display: flex; gap: 6px; margin-top: 12px; }
  .action-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: bold;
    padding: 4px 10px;
    border: 1px solid var(--text-black);
    background: white;
    cursor: pointer;
  }
  .action-btn.active-opt { background: var(--camel-yellow); }

  .regen-btn {
    width: 100%;
    margin-top: 1rem;
    padding: 10px;
    background: none;
    border: 2px dashed var(--text-black);
    cursor: pointer;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 12px;
  }

  .logout-btn {
    background: none;
    border: none;
    color: var(--marlboro-red);
    text-decoration: underline;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
  }
</style>
</head>
<body>

<!-- PANTALLA LOGIN (REQUISITO 4) -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-title">FLIRTAI LOGIN</div>
    <form onsubmit="handleAuth(event)">
      <div class="auth-form-group">
        <label>Correo Electrónico:</label>
        <input type="email" id="auth-email" required placeholder="nombre@correo.com">
      </div>
      <div class="auth-form-group">
        <label>Contraseña:</label>
        <input type="password" id="auth-pass" required placeholder="******">
      </div>
      <button type="submit" class="gen-btn">Entrar al Sistema</button>
    </form>
  </div>
</div>

<!-- HISTORIAL CON NOMBRES (REQUISITO 1) -->
<aside>
  <div>
    <div class="aside-header">
      <h1>Historial de Casos</h1>
    </div>
    <div class="history-list" id="history-list"></div>
  </div>

  <!-- CONTROL DE INTERACCIONES (REQUISITO 3) -->
  <div>
    <div class="limit-box">
      <div class="limit-title">Créditos de Interacción</div>
      <span class="limit-counter" id="usage-counter">0 / 10</span>
      <div class="limit-bar"><div class="limit-progress" id="warning-progress"></div></div>
    </div>
    <div style="text-align: center; padding-bottom: 1rem;">
      <span id="user-display" style="font-size: 11px; font-weight: bold;"></span><br>
      <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
    </div>
  </div>
</aside>

<!-- PANEL DE OPERACIÓN -->
<main>
  <header>
    <div class="logo">FLIRT<span>AI</span></div>
    
    <!-- IDIOMA AUTOMÁTICO (REQUISITO 6) -->
    <div class="lang-badge">
      Idioma: <span id="detected-lang-label">Español</span>
      <button onclick="changeLangManual()">[Cambiar]</button>
    </div>
  </header>

  <div class="workspace">
    <div class="layout-grid">
      
      <!-- NOMBRE PARA ASIGNAR AL HISTORIAL (REQUISITO 1) -->
      <div class="card">
        <div class="card-label">Nombre del Contacto</div>
        <input type="text" id="chat-name" placeholder="Ej: Elena / Marcos">
      </div>

      <!-- CAPTURA -->
      <div class="card">
        <div class="card-label">Captura del Perfil</div>
        <div class="upload-zone" id="upload-zone" onclick="document.getElementById('img-input').click()">
          <input type="file" id="img-input" accept="image/*" onchange="handleImg(this)">
          Arrastra o selecciona la captura aquí
        </div>
        <div class="preview-wrap" id="preview-wrap">
          <img id="preview-img" src="" alt="">
          <div>
            <button class="preview-remove" onclick="removeImg()">Quitar imagen</button>
          </div>
        </div>
      </div>

      <!-- ÚLTIMO MENSAJE -->
      <div class="card">
        <div class="card-label">Último mensaje recibido</div>
        <textarea id="their-msg" rows="2" placeholder="Copia el texto exacto aquí si ya te ha respondido..."></textarea>
      </div>

      <!-- RECUADRO DE DETALLES PERSONALIZADOS (REQUISITO 2) -->
      <div class="card">
        <div class="card-label">
          Detalle o Matiz para Personalizar (Max 175 caract.)
          <span class="char-counter" id="char-counter">0 / 175</span>
        </div>
        <textarea 
          id="custom-details" 
          maxlength="175" 
          rows="2" 
          placeholder="Ej: Haz la respuesta 2 más sarcástica o pídele el número directamente..."
          oninput="updateCharCounter(this)"
        ></textarea>
      </div>

      <button class="gen-btn" id="gen-btn" onclick="generate()">Generar alternativas de mensaje</button>

      <div class="results" id="results"></div>

    </div>
  </div>
</main>

<script>
  let imgBase64 = null; let imgType = null;
  let currentUser = null; let currentLanguage = 'español';
  let chatsHistory = []; let activeChatId = null;

  window.onload = function() {
    const session = localStorage.getItem('fl_session');
    if(session) { currentUser = session; initApp(); }
  };

  function handleAuth(e) {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    if(email) {
      currentUser = email;
      localStorage.setItem('fl_session', email);
      if(!localStorage.getItem(`use_${currentUser}`)) localStorage.setItem(`use_${currentUser}`, '0');
      initApp();
    }
  }

  function logout() {
    localStorage.removeItem('fl_session');
    currentUser = null;
    document.getElementById('auth-screen').style.display = 'flex';
  }

  function initApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('user-display').textContent = currentUser;
    updateUsageUI();
    loadHistoryFromStorage();
  }

  function updateUsageUI() {
    const currentUsage = parseInt(localStorage.getItem(`use_${currentUser}`) || '0');
    document.getElementById('usage-counter').textContent = `${currentUsage} / 10`;
    const percentage = Math.min((currentUsage / 10) * 100, 100);
    document.getElementById('warning-progress').style.width = `${percentage}%`;
    document.getElementById('gen-btn').disabled = (currentUsage >= 10);
    if(currentUsage >= 10) document.getElementById('gen-btn').textContent = 'LÍMITE ALCANZADO (10/10)';
  }

  function updateCharCounter(textarea) {
    document.getElementById('char-counter').textContent = `${textarea.value.length} / 175`;
  }

  function changeLangManual() {
    const selected = prompt("Especifica el nuevo idioma:");
    if(selected) {
      currentLanguage = selected.toLowerCase();
      document.getElementById('detected-lang-label').textContent = currentLanguage;
    }
  }

  function handleImg(input) {
    const file = input.files[0]; if (!file) return;
    imgType = file.type; const reader = new FileReader();
    reader.onload = e => {
      imgBase64 = e.target.result.split(',')[1];
      document.getElementById('preview-img').src = e.target.result;
      document.getElementById('upload-zone').style.display = 'none';
      document.getElementById('preview-wrap').style.display = 'flex';
    };
    reader.readAsDataURL(file);
  }

  function removeImg() {
    imgBase64 = null; imgType = null;
    document.getElementById('img-input').value = '';
    document.getElementById('upload-zone').style.display = 'block';
    document.getElementById('preview-wrap').style.display = 'none';
  }

  async function generate() {
    const currentUsage = parseInt(localStorage.getItem(`use_${currentUser}`) || '0');
    if (currentUsage >= 10) return;

    const theirMsg = document.getElementById('their-msg').value.trim();
    const customDetails = document.getElementById('custom-details').value.trim();
    let chatName = document.getElementById('chat-name').value.trim() || "Contacto Nuevo";

    if (!imgBase64 && !theirMsg) { alert('Sube una captura o introduce un texto.'); return; }
    setLoading(true);

    const prompt = `Actúa como asistente de redacción para apps de ligar. 
Analiza las entradas. ${imgBase64 ? 'Detecta el idioma automáticamente a través de la imagen.' : ''}
${customDetails ? 'Usa esta especificación mandada por el usuario para alterar el resultado: "' + customDetails + '"' : ''}

Retorna SOLO un JSON válido:
{"idioma":"idioma detectado","mensajes":[{"etiqueta":"Tono","texto":"mensaje"}],"consejo":"consejo rápido"}`;

    try {
      const res = await fetch('/.netlify/functions/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
      });
      const data = await res.json();
      // Procesamiento simulado/real del contenido JSON de Claude...
      localStorage.setItem(`use_${currentUser}`, (currentUsage + 1).toString());
      updateUsageUI();
      saveChatToHistory(chatName, data, theirMsg);
      renderResults(data, theirMsg);
    } catch(e) {
      alert("Error procesando los datos.");
    }
    setLoading(false);
  }

  function saveChatToHistory(name, data, theirMsg) {
    chatsHistory.unshift({ id: Date.now(), name, data, theirMsg, date: new Date().toLocaleDateString() });
    localStorage.setItem(`chats_${currentUser}`, JSON.stringify(chatsHistory));
    renderHistoryList();
    activeChatId = 0;
  }

  function loadHistoryFromStorage() {
    chatsHistory = JSON.parse(localStorage.getItem(`chats_${currentUser}`) || '[]');
    renderHistoryList();
  }

  function renderHistoryList() {
    const container = document.getElementById('history-list'); container.innerHTML = '';
    chatsHistory.forEach((chat, idx) => {
      const btn = document.createElement('button');
      btn.className = `history-item ${activeChatId === idx ? 'active' : ''}`;
      btn.onclick = () => { activeChatId = idx; renderHistoryList(); renderResults(chat.data, chat.theirMsg); };
      btn.innerHTML = `<span class="history-name">${chat.name}</span><span class="history-meta">${chat.date}</span>`;
      container.appendChild(btn);
    });
  }

  function renderResults(data, theirMsg) {
    const wrap = document.getElementById('results'); wrap.style.display = 'block';
    let html = '';
    if (theirMsg) html += `<div class="section-label">Recibido</div><div class="their-bubble">${theirMsg}</div>`;
    html += `<div class="section-label">Alternativas de respuesta sugeridas</div>`;
    
    // Fallback si la data viene cruda para pruebas
    const lista = data.mensajes || [{etiqueta:"Normal", texto:"Ejemplo de respuesta generada."}];
    lista.forEach((m, i) => {
      html += `
      <div class="msg-card">
        <div class="msg-style">${m.etiqueta}</div>
        <div class="msg-text">${m.texto}</div>
        <div class="msg-actions">
          <button class="action-btn" onclick="navigator.clipboard.writeText('${m.texto}')">📋 Copiar Texto</button>
        </div>
      </div>`;
    });
    wrap.innerHTML = html;
  }

  function setLoading(on) {
    const btn = document.getElementById('gen-btn'); btn.disabled = on;
    btn.textContent = on ? 'Analizando captura...' : 'Generar alternativas de mensaje';
  }
</script>
</body>
</html>
